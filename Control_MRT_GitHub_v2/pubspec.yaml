name: mrt_control_app
description: "App móvil offline para relevamiento, procesamiento, diseño y control de obra de Micro-embalses de Retención Temporaria (MRT)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  excel: ^4.0.3
  file_picker: ^8.0.0
  pdf: ^3.10.8
  printing: ^5.13.0
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
