      - name: Crear local.properties para Android
        working-directory: mrt_app_flutter/android
        run: |
          FLUTTER_SDK_PATH=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_SDK_PATH" > local.properties
          echo "flutter.versionCode=1" >> local.properties
          echo "flutter.versionName=1.0.0" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
