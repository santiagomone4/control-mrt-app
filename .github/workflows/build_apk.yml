name: Compilar APK Android - Control MRT

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Crear local.properties para Android
        working-directory: Control_MRT_GitHub_v2/android
        run: |
          FLUTTER_SDK_PATH=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_SDK_PATH" > local.properties
          echo "flutter.versionCode=1" >> local.properties
          echo "flutter.versionName=1.0.0" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Instalar Dependencias
        working-directory: Control_MRT_GitHub_v2
        run: flutter pub get

      - name: Compilar APK Release
        working-directory: Control_MRT_GitHub_v2
        run: flutter build apk --release

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Control_MRT_Release_APK
          path: Control_MRT_GitHub_v2/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
